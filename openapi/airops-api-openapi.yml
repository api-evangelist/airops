---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/public_api/airops_apps/executions/{execution_uuid}":
    get:
      summary: Retrieve an execution
      description: " Returns the **execution** with the given uuid. You can use this
        endpoint to check the status of the execution. "
      tags:
      - Executions
      operationId: getExecution
      parameters:
      - "$ref": "#/components/parameters/execution_uuid"
        description: The execution uuid
      security:
      - bearer: []
      responses:
        '401':
          description: Authentication error
        '200':
          description: Execution found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Execution"
              example:
                "$ref": "#/components/examples/Execution/value"
  "/public_api/airops_apps/{app_uuid}/execute":
    post:
      summary: Execute
      description: " This endpoint allows you to execute an app. You can use this
        endpoint to execute an app and get the output of the execution.\n\n Preconditions:
        the app must be **published**.\n\n\n> This endpoint executes the app immediately
        and returns the result, unless you are at your current capacity, or your app
        takes more than 10 minutes to run, in which case it will fail.\n\n If you
        want to execute an app asynchronously, use the [async_execute](#/paths/~1public_api~1airops_apps~1{app_uuid}~1async_execute/post)
        endpoint.\n\n "
      tags:
      - Executions
      operationId: executeApp
      parameters:
      - "$ref": "#/components/parameters/app_uuid"
        description: The app uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version_slug:
                  type: integer
                  example: '12'
                  description: The version of the app (will use the default version
                    if not provided)
                inputs:
                  type: object
                  example:
                    name: John Doe
                  description: The inputs of the app
              required:
              - inputs
            example:
              inputs:
                name: John Doe
      security:
      - bearer: []
      responses:
        '200':
          description: Execution created
          content:
            application/json:
              schema:
                type: object
                properties:
                  airops_app_execution:
                    "$ref": "#/components/schemas/Execution"
              example:
                "$ref": "#/components/examples/Execution/value"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: name_input_value can't be blank
        '401':
          description: Authentication error
  "/public_api/airops_apps/{app_uuid}/async_execute":
    post:
      summary: Async Execute
      description: " This endpoint allows you to execute an app asynchronously. You
        can use this endpoint to execute an app and get the execution id to check
        the status of the execution.\n\n Preconditions: the app must be **published**.\n\n\n>
        Executions created through this endpoint will be queued and executed at your
        workspace's capacity.\n\n If you want to execute an app immediately, use the
        [execute](#/paths/~1public_api~1airops_apps~1{app_uuid}~1execute/post) endpoint.\n\n "
      tags:
      - Executions
      operationId: asyncExecuteApp
      parameters:
      - "$ref": "#/components/parameters/app_uuid"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version_slug:
                  type: integer
                  example: '12'
                  description: The version of the app (will use the default version
                    if not provided)
                inputs:
                  type: object
                  example:
                    name: John Doe
                  description: The inputs of the app
              required:
              - inputs
            example:
              inputs:
                name: John Doe
      security:
      - bearer: []
      responses:
        '200':
          description: Execution created
          content:
            application/json:
              schema:
                type: object
                properties:
                  airops_app_execution:
                    "$ref": "#/components/schemas/Execution"
              example:
                id: 22
                status: pending
                airops_apps_version_id: 21
                conversation_id:
                credits_used: 34
                error_code:
                error_message:
                feedback:
                inputs:
                  name: John Doe
                output:
                runtime:
                source:
                uuid: c3405f16-d0e8-4d5c-8ad9-85ef332c44ee
                workspace_id: 1
                createdAt: 2024-02-01 16:39:28.161000000 Z
                updatedAt: 2024-02-01 16:39:28.161000000 Z
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: name_input_value can't be blank
        '401':
          description: Authentication error
  "/public_api/airops_apps/{app_uuid}/webhook_async_execute":
    post:
      summary: Webhook Async Execute
      description: " This endpoint allows you to execute an app asynchronously as
        a webhook for an external service.\n\n The payload of the request will be
        mapped to the first input of your app.\n\n Preconditions: the app must be
        **published**.\n\n More information on how to use this endpoint can be found
        [here](https://airops.gitbook.io/docs/execute/advanced/incoming-webhook). "
      tags:
      - Executions
      operationId: WebhookAsyncExecuteApp
      parameters:
      - "$ref": "#/components/parameters/app_uuid"
      - name: auth_token
        in: query
        required: true
        schema:
          type: string
          example: 23iu3h23-34n43yib4-3243n34b4-34n434h
          description: Your workspace API key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version_slug:
                  type: integer
                  example: '12'
                  description: The version of the app (will use the default version
                    if not provided)
                inputs:
                  type: object
                  example:
                    name: John Doe
                  description: The inputs of the app
              required:
              - inputs
            example:
              inputs:
                name: John Doe
      responses:
        '200':
          description: Execution created
          content:
            application/json:
              schema:
                type: object
                properties:
                  airops_app_execution:
                    "$ref": "#/components/schemas/Execution"
              example:
              - "$ref": "#/components/examples/Execution/value"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: name_input_value can't be blank
        '401':
          description: Authentication error
  "/public_api/airops_apps/executions/{execution_uuid}/cancel":
    patch:
      summary: Cancel an execution
      description: " This endpoint allows you to cancel an execution.\n\n Preconditions:
        the execution must be in the **pending** or **running** status.\n\n "
      tags:
      - Executions
      parameters:
      - "$ref": "#/components/parameters/execution_uuid"
      security:
      - bearer: []
      responses:
        '204':
          description: Execution cancelled
        '401':
          description: Authentication error
  "/public_api/airops_apps/executions/{execution_uuid}/retry":
    post:
      summary: Retry an execution
      description: " This endpoint allows you to retry an execution from the last
        failed step.\n\n Preconditions: the execution must be in the **error** status.\n\n "
      tags:
      - Executions
      parameters:
      - "$ref": "#/components/parameters/execution_uuid"
      security:
      - bearer: []
      responses:
        '204':
          description: Execution retried
        '401':
          description: Authentication error
        '400':
          description: Execution is not in error status
  "/public_api/airops_apps/executions/{execution_uuid}/feedback":
    patch:
      summary: Rate an execution
      description: " This endpoint allows you to rate an execution.\n\n Preconditions:
        the execution must be in the **success** status.\n\n "
      tags:
      - Executions
      parameters:
      - "$ref": "#/components/parameters/execution_uuid"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback:
                  type: string
                  enum:
                  - positive
                  - neutral
                  - negative
                  example: positive
                  description: The feedback of the execution
              required:
              - feedback
            example:
              feedback: positive
      security:
      - bearer: []
      responses:
        '204':
          description: Feedback sent
        '401':
          description: Authentication error
  "/public_api/airops_apps/:airops_app_id/executions":
    get:
      summary: Retrieve all executions for an Airops app
      description: 'Returns all the **executions** for a given Airops app. You can
        use this endpoint to check the status/input/output of all the executions.

        '
      tags:
      - Executions
      parameters:
      - name: airops_app_id
        in: query
        required: true
        description: The Airops app ID to fetch executions from
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: The cursor value to use for pagination
        schema:
          type: string
      - name: items
        in: query
        required: false
        description: The amount of items to fetch
        schema:
          type: integer
          example: 10
          minimum: 1
          maximum: 100
      security:
      - bearer: []
      responses:
        '401':
          description: Authentication error
        '200':
          description: Executions found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: The list of executions returned
                    items:
                      "$ref": "#/components/schemas/Execution"
                  meta:
                    type: object
                    description: Pagination information
                    properties:
                      count:
                        type: integer
                        description: Total amount of records in all pages
                      has_more:
                        type: boolean
                        description: Whether there are more records to fetch
                      cursor:
                        type: string
                        description: Cursor value to use in the next request
              example:
              - "$ref": "#/components/examples/AiropsAppExecutions/value"
  "/public_api/airops_apps":
    get:
      summary: Retrieve all apps
      description: " Returns all the **apps**. "
      tags:
      - Apps
      security:
      - bearer: []
      responses:
        '200':
          description: Apps found
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/App"
              example:
              - "$ref": "#/components/examples/App/value"
        '401':
          description: Authentication error
  "/public_api/airops_apps/{app_uuid}":
    get:
      summary: Retrieve an app
      description: " Returns the **app** with the given uuid. "
      tags:
      - Apps
      operationId: getApp
      parameters:
      - "$ref": "#/components/parameters/app_uuid"
      security:
      - bearer: []
      responses:
        '401':
          description: Authentication error
        '200':
          description: App found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/App"
              example:
                "$ref": "#/components/examples/App/value"
  "/public_api/agent_apps/{app_uuid}/chat":
    post:
      summary: Chat
      description: 'This endpoint allows you to send a message (chat) to an Agent
        app. You can include inputs with your message which will be passed to the
        app.

        '
      tags:
      - Agent
      operationId: chatWithAgent
      parameters:
      - "$ref": "#/components/parameters/app_uuid"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ChatPayload"
              required:
              - message
            example:
              message: Hello, how are you?
              inputs:
                name: John Doe
      security:
      - bearer: []
      responses:
        '401':
          description: Authentication error
        '200':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    "$ref": "#/components/schemas/ChatResponse/properties/result"
                  airops_app_execution:
                    "$ref": "#/components/schemas/Execution"
              example:
                result:
                  "$ref": "#/components/examples/ChatResponse/value/result"
                airops_app_execution:
                  "$ref": "#/components/examples/Execution/value"
  "/public_api/agent_apps/{app_uuid}/async_chat":
    post:
      summary: Async Chat
      description: 'This endpoint allows you to send a message (chat) to an Agent
        app asynchronously, without waiting for the response. You can include inputs
        with your message which will be passed to the app.

        '
      tags:
      - Agent
      operationId: asyncChatWithAgent
      parameters:
      - "$ref": "#/components/parameters/app_uuid"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Hello, how are you?
                  description: The message to send to the agent.
                inputs:
                  type: object
                  description: Optional inputs to send along with the message.
                  example:
                    name: John Doe
                  additionalProperties: true
              required:
              - message
            example:
              message: Hello, how are you?
              inputs:
                name: John Doe
      security:
      - bearer: []
      responses:
        '401':
          description: Authentication error
        '200':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    "$ref": "#/components/schemas/ChatPayload/properties/session_id"
                  airops_app_execution:
                    "$ref": "#/components/schemas/Execution"
              example:
                session_id:
                  "$ref": "#/components/examples/ChatPayload/value/session_id"
                airops_app_execution:
                  "$ref": "#/components/examples/Execution/value"
  "/public_api/workspace_files":
    post:
      summary: Upload
      description: " This endpoint allows you to upload a file to the workspace.\nYou
        can use this endpoint to upload a file and get the id of the file to use as
        an input in an app. "
      operationId: workspaceFileUpload
      tags:
      - Files
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 23
                    description: The id of the file, you can use this id as an app's
                      input
                  created_at:
                    type: string
                    format: date-time
                    example: 2023-06-20 00:49:56.696000000 Z
                  updated_at:
                    type: string
                    format: date-time
                    example: 2023-10-24 11:26:21.820000000 Z
              example:
                id: 23
                created_at: 2023-06-20 00:49:56.696000000 Z
                updated_at: 2023-10-24 11:26:21.820000000 Z
        '401':
          description: Authentication error'
      security:
      - bearer: []
  "/public_api/grids/{grid_id}/sheets/{sheet_id}/generate_csv":
    post:
      summary: Generate CSV
      description: Generate a CSV file from a sheet asynchronously.
      tags:
      - Grids
      security:
      - bearer: []
      parameters:
      - "$ref": "#/components/parameters/grid_id"
        description: The Grid id
      - "$ref": "#/components/parameters/sheet_id"
        description: The Sheet id
      responses:
        '200':
          description: Job to generate CSV created
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: integer
                    example: 230
                    description: The id of the job
              example:
                id: 230
        '401':
          description: Authentication error
  "/public_api/grids/{grid_id}/sheets/{sheet_id}/download_csv/latest":
    get:
      summary: Download Latest CSV
      description: Downloads the latest generated CSV file for a sheet. This endpoint
        redirects to the CSV file URL if a successful generation exists, or returns
        a 404 error if no CSV has been generated yet.
      tags:
      - Grids
      security:
      - bearer: []
      parameters:
      - "$ref": "#/components/parameters/grid_id"
        description: The Grid ID
      - "$ref": "#/components/parameters/sheet_id"
        description: The Sheet ID
      responses:
        '302':
          description: Redirects to the CSV download URL
        '404':
          description: Latest CSV not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: We could not find the latest CSV for this grid.
              example:
                error: We could not find the latest CSV for this grid.
        '401':
          description: Authentication error
  "/public_api/vector_stores/{memory_store_id}/search":
    get:
      summary: Search
      description: Perform a search on a memory store.
      tags:
      - Memory Stores
      operationId: searchMemoryStore
      parameters:
      - "$ref": "#/components/parameters/memory_store_id"
        description: The Memory Store id
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: The query to search for
      - name: topk
        in: query
        required: false
        schema:
          type: integer
          example: 10
          minimum: 1
          maximum: 1000
        description: The number of results to return
      - name: filter
        in: query
        required: false
        schema:
          type: object
          properties:
            key:
              type: string
            value:
              type: string
        description: The filter to apply to the search. See https://docs.airops.com/basic-setup/memory-stores/memory-stores-metadata#how-to-filter-on-metadata
          for more information.
      security:
      - bearer: []
      responses:
        '401':
          description: Authentication error
        '400':
          description: Invalid Request
        '200':
          description: Results found
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      "$ref": "#/components/schemas/MemoryStoreSearchResultItem"
  "/public_api/vector_stores/{memory_store_id}/vector_store_documents":
    post:
      summary: Add Document
      description: Add a document to a memory store.
      tags:
      - Memory Stores
      operationId: addDocumentToMemoryStore
      parameters:
      - "$ref": "#/components/parameters/memory_store_id"
        description: The Memory Store id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The content of the document
                name:
                  type: string
                  description: The name of the document
                metadata:
                  type: object
                  description: The metadata of the document
              required:
              - name
              - text
      security:
      - bearer: []
      responses:
        '401':
          description: Authentication error
        '400':
          description: Invalid Request
        '200':
          description: Document added
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryStoreDocument"
  "/public_api/vector_stores/{memory_store_id}/vector_store_documents/{memory_store_document_id}":
    put:
      summary: Update Document
      description: Update a document in a memory store.
      tags:
      - Memory Stores
      operationId: updateDocumentInMemoryStore
      parameters:
      - "$ref": "#/components/parameters/memory_store_id"
        description: The Memory Store id
      - "$ref": "#/components/parameters/memory_store_document_id"
        description: The id of the document to update
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The content of the document
                name:
                  type: string
                  description: The name of the document
                metadata:
                  type: object
                  description: The metadata of the document
              required:
              - name
              - text
      security:
      - bearer: []
      responses:
        '401':
          description: Authentication error
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryStoreDocument"
    delete:
      summary: Delete Document
      description: Delete a document from a memory store.
      tags:
      - Memory Stores
      operationId: deleteDocumentFromMemoryStore
      parameters:
      - "$ref": "#/components/parameters/memory_store_id"
        description: The Memory Store id
      - "$ref": "#/components/parameters/memory_store_document_id"
        description: The id of the document to delete
      security:
      - bearer: []
      responses:
        '401':
          description: Authentication error
        '200':
          description: Document deleted
  "/public_api/brand_kits/list":
    post:
      summary: List Brand Kits
      description: Brand Kits for AEO operations — provides the brand_kit_id required
        by all AEO tools (analytics, prompts, pages, citations, reports, grids, topics,
        personas).
      tags:
      - Brand Kits
      operationId: listBrandKits
      security:
      - bearer: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          nullable: true
                          type: integer
                          description: Unique identifier for the Brand Kit
                        workspace_name:
                          nullable: true
                          type: string
                          description: Name of the workspace this Brand Kit belongs
                            to
                        brand_name:
                          nullable: true
                          type: string
                          description: Name of the brand
                        brand_url:
                          nullable: true
                          type: string
                          description: URL of the brand website
                        brand_about:
                          nullable: true
                          type: string
                          description: Description/overview of the brand
                        brand_customer:
                          nullable: true
                          type: string
                          description: Description of the target customer
                        brand_competitors:
                          nullable: true
                          type: string
                          description: Information about brand competitors
                        brand_point_of_view:
                          nullable: true
                          type: string
                          description: The brand's unique perspective or stance
                        writing_persona:
                          nullable: true
                          type: string
                          description: The persona/voice used in brand writing
                        writing_tone:
                          nullable: true
                          type: string
                          description: The tone of voice for brand content
                        writing_cta:
                          nullable: true
                          type: string
                          description: Default call-to-action text
                        writing_cta_url:
                          nullable: true
                          type: string
                          description: URL for call-to-action links
                        writing_rules:
                          nullable: true
                          type: string
                          description: Writing rules and guidelines
                        writing_sample_title:
                          nullable: true
                          type: string
                          description: Title of the writing sample
                        writing_sample_outline:
                          nullable: true
                          type: string
                          description: Outline of the writing sample
                        writing_sample_body:
                          nullable: true
                          type: string
                          description: Body content of the writing sample
                        writing_sample_url:
                          nullable: true
                          type: string
                          description: URL reference for the writing sample
                        primary_color:
                          nullable: true
                          type: string
                          description: 'Primary brand color (hex format, e.g., #FF5733)'
                        secondary_color:
                          nullable: true
                          type: string
                          description: Secondary brand color (hex format)
                        accent_color:
                          nullable: true
                          type: string
                          description: Accent brand color (hex format)
                        header_case:
                          nullable: true
                          type: string
                          description: Header case style (title_case, sentence_case,
                            or custom)
                        header_case_custom_value:
                          nullable: true
                          type: string
                          description: Custom header case rules (when header_case
                            is custom)
                        countries:
                          nullable: true
                          type: array
                          items:
                            type: string
                          description: Array of country codes for brand targeting
                            (e.g., ["US", "GB", "CA"])
                        aeo_enabled:
                          nullable: true
                          type: boolean
                          description: Whether AEO is enabled for the Brand Kit
                        prompts_count:
                          nullable: true
                          type: integer
                          description: Number of prompts/questions associated with
                            this Brand Kit
                        created_at:
                          nullable: true
                          type: string
                          description: When the Brand Kit was created
                        updated_at:
                          nullable: true
                          type: string
                          description: When the Brand Kit was last updated
                        product_lines:
                          nullable: true
                          type: array
                          description: Included product_lines collection (when requested
                            via includes param)
                          items:
                            type: object
                        competitors:
                          nullable: true
                          type: array
                          description: Included competitors collection (when requested
                            via includes param)
                          items:
                            type: object
                        audiences:
                          nullable: true
                          type: array
                          description: Included audiences collection (when requested
                            via includes param)
                          items:
                            type: object
                        content_types:
                          nullable: true
                          type: array
                          description: Included content_types collection (when requested
                            via includes param)
                          items:
                            type: object
                      required:
                      - id
                      - brand_name
                      - workspace_name
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
                required:
                - data
                - meta
        '400':
          description: Bad request - invalid parameters, filters, or sort options
        '401':
          description: Unauthorized - invalid or missing authentication token
        '404':
