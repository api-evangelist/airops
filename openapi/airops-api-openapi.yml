        readme:
          type: string
          example: ''
    Execution:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - error
          - success
          - cancelled
          - review_needed
          example: success
        airops_apps_version_id:
          type: integer
          example: 21
        conversation_id:
          type: string
          example: 23
        credits_used:
          type: integer
          example: 34
        error_code:
          type: string
          example:
        error_message:
          example:
        feedback:
          type: string
          enum:
          - positive
          - neutral
          - negative
        inputs:
          type: object
          example:
            name: John Doe
        output:
          type: object
          example:
            greet: Hello John Doe!
        runtime:
          type: integer
          example: 34
          description: The time it took to execute the app in seconds
        source:
          type: string
        uuid:
          type: string
          maxLength: 36
          minLength: 36
          example: c3405f16-d0e8-4d5c-8ad9-85ef332c44ee
        workspace_id:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: 2024-02-01 16:39:28.161000000 Z
        updatedAt:
          type: string
          format: date-time
          example: 2024-02-01 16:39:28.161000000 Z
      required:
      - id
      - status
      - createdAt
      - updatedAt
    MemoryStoreSearchResultItem:
      type: object
      properties:
        id:
          type: string
        score:
          type: number
        content:
          type: string
        document_name:
          type: string
        metadata:
          type: object
      required:
      - id
      - score
      - content
      - document_name
      - metadata
    MemoryStoreDocument:
      type: object
      properties:
        id:
          type: number
        document_type:
          type: string
        name:
          type: string
        source:
          type: string
        status:
          type: string
        sync_progress_percentage:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        vector_store_id:
          type: number
    WorkflowStep:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - llm
          - conditional
          - app
          - text
          - web_scrape
          - fetch_api
          - code
          - iteration
        config:
          anyOf:
          - "$ref": "#/components/schemas/LLMConfig"
          - "$ref": "#/components/schemas/ConditionalConfig"
          - "$ref": "#/components/schemas/AppConfig"
          - "$ref": "#/components/schemas/TextConfig"
          - "$ref": "#/components/schemas/WebScrapeConfig"
          - "$ref": "#/components/schemas/FetchAPIConfig"
          - "$ref": "#/components/schemas/CodeConfig"
          - "$ref": "#/components/schemas/IterationConfig"
      required:
      - name
      - type
      - config
    LLMConfig:
      type: object
      properties:
        model:
          type: string
        soft_fail:
          type: boolean
        config:
          type: object
          properties:
            prompt:
              type: string
              description: Use `prompt` if the model is gpt-3.5-turbo-instruct. Otherwise,
                use `messages``.
            messages:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                    enum:
                    - user
                    - system
                    - assistant
                  content:
                    type: string
                  id:
                    type: string
                  images:
                    type: array
                    nullable: true
                    items:
                      type: string
                required:
                - role
                - content
            request_consistent_results:
              type: boolean
            response_format:
              type: string
              nullable: true
              enum:
              - text
              - json_object
            stream:
              type: boolean
            temperature:
              type: number
              minimum: 0
              maximum: 1
            note:
              type: string
            model_source:
              type: string
              enum:
              - airops
            max_tokens:
              type: integer
              nullable: true
              minimum: 1
            json_schema:
              type: object
              nullable: true
              properties:
                schema:
                  type: object
                  properties:
                    type:
                      type: object
                      properties:
                        type:
                          type: object
                strict:
                  type: boolean
                name:
                  type: string
              required:
              - schema
              - strict
              - name
          required:
          - prompt
          - messages
          - request_consistent_results
          - response_format
          - stream
          - temperature
          - note
          - model_source
          - max_tokens
      required:
      - model
      - soft_fail
      - config
    ConditionalConfig:
      type: object
      properties:
        condition:
          type: string
          description: The condition to evaluate. Must be javascript compatible code.
        if_branch:
          type: array
          items:
            "$ref": "#/components/schemas/WorkflowStep"
        else_branch:
          type: array
          items:
            "$ref": "#/components/schemas/WorkflowStep"
      required:
      - condition
      - if_branch
      - else_branch
    AppConfig:
      type: object
      properties:
        app_id:
          type: integer
        app_version:
          type: integer
          nullable: true
        inputs:
          type: object
        soft_fail:
          type: boolean
      required:
      - app_id
      - inputs
    TextConfig:
      type: object
      properties:
        template:
          type: string
      required:
      - template
    WebScrapeConfig:
      type: object
      properties:
        config:
          type: object
          properties:
            url:
              type: string
            max_length:
              type: integer
              nullable: true
              minimum: 0
            hard_fail:
              type: boolean
              nullable: true
            render_js:
              type: boolean
              nullable: true
            proxy_type:
              type: string
              enum:
              - auto
              - datacenter
              - residential
            output_type:
              type: string
              nullable: true
              enum:
              - text
              - html
              - markdown
            timeout:
              type: integer
              nullable: true
              minimum: 5000
              maximum: 150000
            remove_boilerplate:
              type: boolean
              nullable: true
            optimize_for:
              type: string
              enum:
              - custom
              - speed
              - accuracy
            soft_fail:
              type: boolean
              nullable: true
            auto_scroll:
              type: boolean
              nullable: true
          required:
          - url
    FetchAPIConfig:
      type: object
      properties:
        body:
          type: string
          description: The jsonified body of the request
        headers:
          type: string
          description: The jsonified headers of the request
        method:
          type: string
          enum:
          - get
          - post
        retries:
          type: integer
          minimum: 0
          maximum: 3
        url:
          type: string
        soft_fail:
          type: boolean
      required:
      - method
      - url
    CodeConfig:
      type: object
      properties:
        config:
          type: object
          properties:
            language:
              type: string
              enum:
              - python
              - javascript
            function:
              type: string
            soft_fail:
              type: boolean
            lambda_function:
              type: string
          required:
          - language
          - function
    IterationConfig:
      type: object
      properties:
        config:
          type: object
          properties:
            iterator:
              type: string
            step_function:
              type: array
              items:
                "$ref": "#/components/schemas/WorkflowStep"
          required:
          - iterator
          - step_function
    BrandKit:
      type: object
      properties:
        id:
          nullable: true
          type: integer
          description: Unique identifier for the Brand Kit
        workspace_name:
          nullable: true
          type: string
          description: Name of the workspace this Brand Kit belongs to
        brand_name:
          nullable: true
          type: string
          description: Name of the brand
        brand_url:
          nullable: true
          type: string
          description: URL of the brand website
        brand_about:
          nullable: true
          type: string
          description: Description/overview of the brand
        brand_customer:
          nullable: true
          type: string
          description: Description of the target customer
        brand_competitors:
          nullable: true
          type: string
          description: Information about brand competitors
        brand_point_of_view:
          nullable: true
          type: string
          description: The brand's unique perspective or stance
        writing_persona:
          nullable: true
          type: string
          description: The persona/voice used in brand writing
        writing_tone:
          nullable: true
          type: string
          description: The tone of voice for brand content
        writing_cta:
          nullable: true
          type: string
          description: Default call-to-action text
        writing_cta_url:
          nullable: true
          type: string
          description: URL for call-to-action links
        writing_rules:
          nullable: true
          type: string
          description: Writing rules and guidelines
        writing_sample_title:
          nullable: true
          type: string
          description: Title of the writing sample
        writing_sample_outline:
          nullable: true
          type: string
          description: Outline of the writing sample
        writing_sample_body:
          nullable: true
          type: string
          description: Body content of the writing sample
        writing_sample_url:
          nullable: true
          type: string
          description: URL reference for the writing sample
        primary_color:
          nullable: true
          type: string
          description: 'Primary brand color (hex format, e.g., #FF5733)'
        secondary_color:
          nullable: true
          type: string
          description: Secondary brand color (hex format)
        accent_color:
          nullable: true
          type: string
          description: Accent brand color (hex format)
        header_case:
          nullable: true
          type: string
          description: Header case style (title_case, sentence_case, or custom)
        header_case_custom_value:
          nullable: true
          type: string
          description: Custom header case rules (when header_case is custom)
        countries:
          nullable: true
          type: array
          items:
            type: string
          description: Array of country codes for brand targeting (e.g., ["US", "GB",
            "CA"])
        aeo_enabled:
          nullable: true
          type: boolean
          description: Whether AEO is enabled for the Brand Kit
        prompts_count:
          nullable: true
          type: integer
          description: Number of prompts/questions associated with this Brand Kit
        created_at:
          nullable: true
          type: string
          description: When the Brand Kit was created
        updated_at:
          nullable: true
          type: string
          description: When the Brand Kit was last updated
        product_lines:
          nullable: true
          type: array
          description: Included product_lines collection (when requested via includes
            param)
          items:
            type: object
        competitors:
          nullable: true
          type: array
          description: Included competitors collection (when requested via includes
            param)
          items:
            type: object
        audiences:
          nullable: true
          type: array
          description: Included audiences collection (when requested via includes
            param)
          items:
            type: object
        content_types:
          nullable: true
          type: array
          description: Included content_types collection (when requested via includes
            param)
          items:
            type: object
    BrandKitListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/BrandKit"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
      required:
      - data
      - meta
    BrandKitShowResponse:
      type: object
      properties:
        data:
          "$ref": "#/components/schemas/BrandKit"
      required:
      - data
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        per_page:
          type: integer
          description: Items per page
        total_count:
          type: integer
          description: Total number of items
        total_pages:
          type: integer
          description: Total number of pages
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
