        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_kit_id:
                  type: integer
                  description: The ID of the Brand Kit
                filters:
                  type: array
                  description: |-
                    Filter results. Nested fields (e.g. `writing_rules.text`) filter within an included association and require that association in `includes`.

                    **Available fields:**
                    - **name** (EQUALS, CONTAINS): Filter by tag name
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        enum:
                        - name
                        description: 'Field to filter on. name: Filter by tag name'
                      operator:
                        type: string
                        enum:
                        - EQUALS
                        - CONTAINS
                        description: |-
                          Filter operator.

                          - **EQ/EQUALS**: Exact match
                          - **NEQ**: Not equal
                          - **GT/GEQ/LT/LEQ**: Numeric/date comparisons
                          - **CONTAINS**: Partial text match
                          - **STARTS_WITH**: Text prefix match
                          - **IN**: Match any value in array
                          - **HAS_ALL**: (tags filter) match only items having every listed value
                          - **NOT_IN**: (tags filter) match only items having none of the listed values
                      value:
                        description: Filter value (type depends on field and operator)
                    required:
                    - field
                    - operator
                    - value
                fields:
                  type: array
                  description: |-
                    Select additional fields to return.

                    **Optional fields:**
                    - **id**: Unique identifier for the tag
                    - **name**: The tag name
                    - **color**: The tag color (hex code)
                  items:
                    type: string
                    enum:
                    - id
                    - name
                    - color
                sort:
                  type: string
                  enum:
                  - name
                  - "-name"
                  - created_at
                  - "-created_at"
                  description: |-
                    Sort field. Prefix with - for descending.

                    **Available sort fields:**
                    - **name/-name**: Sort alphabetically by tag name
                    - **created_at/-created_at**: Sort by creation date
                page:
                  type: integer
                  default: 1
                  description: Page number
                per_page:
                  type: integer
                  default: 25
                  maximum: 100
                  description: Items per page
              required:
              - brand_kit_id
