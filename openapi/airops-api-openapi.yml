                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          nullable: true
                          type: integer
                          description: Unique identifier for the content update
                        url:
                          nullable: true
                          type: string
                          description: The URL associated with the content update
                        type:
                          nullable: true
                          type: string
                          description: Type of content update
                          enum:
                          - page_published
                          - page_refreshed
                          -
                        source:
                          nullable: true
                          type: string
                          description: Source that created the content update
                          enum:
                          - track_event_step
                          - wordpress_native_cms_integration
                          - webflow_native_cms_integration
                          - shopify_native_cms_integration
                          - ghost_native_cms_integration
                          - webflow_grid_export
                          - wordpress_grid_export
                          - mcp
                          - api
                          - web_page_change_tracking
                          -
                        brand_kit_id:
                          nullable: true
                          type: integer
                          description: ID of the associated Brand Kit
                        workspace_id:
                          nullable: true
                          type: integer
                          description: ID of the associated workspace
                        created_at:
                          nullable: true
                          type: string
                          description: When the content update was created
                        updated_at:
                          nullable: true
                          type: string
                          description: When the content update was last updated
                        change_detection:
                          nullable: true
                          type: object
                          description: 'Change detection for this content update:
                            detection status, the categories of detected changes,
                            and whether a before/after diff is available. On a single-update
                            fetch it also carries a nested `changes` array (the before/after
                            diff). Null when change detection has not run for the
                            update, including workspaces where it is not enabled.'
                        metadata_entries:
                          nullable: true
                          type: array
                          description: Included metadata_entries collection (when
                            requested via includes param)
                          items:
                            type: object
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
                required:
                - data
                - meta
        '400':
          description: Bad request - invalid parameters, filters, or sort options
        '401':
          description: Unauthorized - invalid or missing authentication token
        '404':
          description: Not found - resource does not exist
        '412':
          description: Precondition failed - AEO not configured for this brand kit
      parameters:
      - name: brand_kit_id
        in: path
        required: true
        schema:
          type: integer
        description: The Brand Kit ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id:
                  type: integer
                  description: ID of the workspace to retrieve results from. If not
                    provided, returns results from all workspaces the user belongs
                    to.
                brand_kit_id:
                  type: integer
                  description: Optional Brand Kit ID to filter content updates by
                filters:
                  type: array
                  description: |-
                    Filter results. Nested fields (e.g. `writing_rules.text`) filter within an included association and require that association in `includes`.

                    **Available fields:**
                    - **url** (EQUALS, CONTAINS): Filter by content update URL
                    - **type** (EQ, IN): Filter by content update type
                    - **source** (EQ, IN): Filter by content update source
                    - **brand_kit_id** (EQ): Filter by Brand Kit ID
                    - **created_at** (GT, LT, GEQ, LEQ): Filter by creation date
                    - **has_changes** (EQ): Filter to content updates where change detection found at least one confirmed change (true) or found none / has no detection run (false)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        enum:
                        - url
                        - type
                        - source
                        - brand_kit_id
                        - created_at
                        - has_changes
                        description: 'Field to filter on. url: Filter by content update
                          URL; type: Filter by content update type (values: page_published,
                          page_refreshed); source: Filter by content update source
                          (values: track_event_step, wordpress_native_cms_integration,
                          webflow_native_cms_integration, shopify_native_cms_integration,
                          ghost_native_cms_integration, webflow_grid_export, wordpress_grid_export,
                          mcp, api, web_page_change_tracking); brand_kit_id: Filter
                          by Brand Kit ID; created_at: Filter by creation date; has_changes:
                          Filter to content updates where change detection found at
                          least one confirmed change (true) or found none / has no
                          detection run (false)'
                      operator:
                        type: string
                        enum:
                        - EQUALS
                        - CONTAINS
                        - EQ
                        - IN
                        - GT
                        - LT
                        - GEQ
                        - LEQ
                        description: |-
                          Filter operator.

                          - **EQ/EQUALS**: Exact match
                          - **NEQ**: Not equal
                          - **GT/GEQ/LT/LEQ**: Numeric/date comparisons
                          - **CONTAINS**: Partial text match
                          - **STARTS_WITH**: Text prefix match
                          - **IN**: Match any value in array
                          - **HAS_ALL**: (tags filter) match only items having every listed value
                          - **NOT_IN**: (tags filter) match only items having none of the listed values
                      value:
                        description: Filter value (type depends on field and operator)
