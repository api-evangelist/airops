source: >-
  mcp/airops-mcp.yml + https://docs.airops.com/developers/tools.md bound against
  openapi/airops-api-openapi.yml
note: >-
  The AirOps MCP server and the AirOps REST API are overlapping but NON-IDENTICAL
  projections of the same workspace core. The REST API is execution-first (run
  Workflows/Apps, poll executions, manage Memory Stores) plus a read-oriented
  Insights/Brand Kit surface; MCP is authoring-first (mutate Brand Kits, create
  prompts and tags, read and write Grids, ingest Knowledge Base documents). Live
  tools/list introspection is OAuth-gated (HTTP 401 "Invalid or missing access
  token" on 2026-08-13), so tools are bound by documented name + semantics rather
  than by fetched inputSchema; confidence is recorded honestly per row. Where a
  row is bound high, the backing operation's parameters + requestBody in the
  OpenAPI ARE the tool's real input contract.
