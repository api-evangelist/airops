generated: '2026-08-13'
method: searched
source: https://docs.airops.com/developers/api
also_derived_from: openapi/airops-api-openapi.yml
docs:
- https://docs.airops.com/developers/api
- https://docs.airops.com/api-reference/api-reference/executions
format: http-status
note: >-
  Upgraded 2026-08-13 from the docs-only version: response codes are now
  aggregated across all 42 operations of the published OpenAPI at
  https://api.airops.com/public_api/openapi.yaml and cross-checked against the
  Insights API error table. AirOps does NOT publish an RFC 9457 problem+json
  contract and has no numeric or symbolic error registry — the HTTP status IS the
  error vocabulary, and the body is a bare {"error": "..."} string. That is the
  finding, not an omission on our side.
envelope:
  content_type: application/json
  shape: '{ "error": "<message>" }'
  problem_json: false
  rfc9457: false
  validation_detail:
    field: validation_errors
    applies_to: 400 responses on the Insights/Brand Kit surface
    note: Documented in the Insights API guide; not modelled as a schema in the OpenAPI.
  execution_level:
    fields: [error_code, error_message]
    schema: Execution
    note: >-
      A FAILED RUN is not an HTTP error. An execution that fails returns HTTP 200
      with status "error" and error_code/error_message on the Execution object.
      Agents must inspect Execution.status, not just the status code — this is
      the most consequential error-handling rule in this API and it is easy to
      miss.
coverage:
  operations: 42
  source: openapi/airops-api-openapi.yml
errors:
- status: 200
  meaning: OK — request succeeded; response body carries the resource or execution.
  occurrences: 37
  caution: >-
    Execution endpoints return 200 even when the run itself errored. Check
    Execution.status against [pending, running, error, success, cancelled,
    review_needed].
- status: 201
  meaning: Created — successful resource creation (content updates).
  occurrences: 1
- status: 204
  meaning: >-
    No Content — success with no body. Returned by cancel, retry and feedback on
    executions.
  occurrences: 3
- status: 302
  meaning: Found — redirects to the generated CSV download URL for a Grid sheet.
  occurrences: 1
  operations:
  - 'GET /public_api/grids/{grid_id}/sheets/{sheet_id}/download_csv/latest'
  note: Clients must follow redirects on the Grid CSV download path.
- status: 400
  meaning: >-
    Invalid input — malformed request body, missing required inputs, or an
    invalid filter, operator or sort field.
  occurrences: 29
  remediation: >-
    Check validation_errors in the response. On execute endpoints, confirm the
    inputs object matches the App's declared inputs and that version_slug (if
    sent) names a published version.
- status: 401
  meaning: >-
    Authentication error — missing or invalid API key. Declared on every one of
    the 42 operations.
  occurrences: 42
  remediation: >-
    Send Authorization: Bearer <workspace API key>. Note that regenerating the
    workspace key immediately invalidates the previous one. The MCP server at
    app.airops.com/mcp returns the same 401 shape ({"error":"Invalid or missing
    access token"}) for an unauthenticated JSON-RPC call.
- status: 404
  meaning: >-
    Not found — the Brand Kit, execution, App or document does not exist, or the
    caller has no access to it. Also returned when a generated CSV is not yet
    available.
  occurrences: 24
  note: >-
    AirOps does not distinguish "does not exist" from "not authorized" on this
    status — the Insights guide describes 404 as "Brand Kit doesn't exist or you
    don't have access".
- status: 412
  meaning: Precondition failed — AEO is not configured for this Brand Kit.
  occurrences: 23
  remediation: >-
    Enable AEO on the Brand Kit. Use listBrandKits filtered on aeo_enabled = true
    (or the MCP get_insights_settings tool) to select a Brand Kit that can serve
    the Insights endpoints before calling them.
  note: >-
    An unusual and useful choice — 412 cleanly separates "your account is not
    provisioned for this capability" from a 403. It is declared on 23 of the 42
    operations, effectively the whole AEO surface.
- status: 422
  meaning: >-
    Unprocessable entity — validation failed. On analytics specifically:
    end_date is today or later, the date range exceeds the grain limit, or more
    than 3 dimensions were requested.
  occurrences: 1
  remediation: >-
    Set end_date to yesterday or earlier; window long ranges to the grain limit
    (120 days daily, 180 weekly, 365 monthly); request at most 3 dimensions.
  note: >-
    The Insights guide documents 422 across the analytics surface, but the
    OpenAPI declares it on only one operation — a documented-vs-declared gap.
- status: 429
  meaning: Not published.
  occurrences: 0
  note: >-
    No rate-limit response is documented or declared anywhere. See
    rate-limits/airops-rate-limits.yml.
gaps:
- No RFC 9457 application/problem+json representation.
- No stable machine-readable error codes — the body carries a human string only.
- >-
  Execution.error_code exists on the Execution schema but its value set is not
  documented anywhere, so an agent cannot branch on it reliably.
- 422 is documented in prose more broadly than it is declared in the OpenAPI.
