api_access:
  note: >-
    API data export is listed as an Enterprise-tier capability in the plan
    comparison table ("Data Export: CSV, API" on Enterprise vs "CSV" on Solo and
    Pro). The workspace API key itself is available from Workspace Settings, but
    programmatic Insights export is positioned as an Enterprise feature.
trial:
  available: true
  length_days: 14
  description: >-
    14-day free trial with access to the paid feature set; no payment details
    required until the trial ends. Ends when trial tasks run out, the 14 days
    elapse, or the user upgrades early.
  testing_credits: >-
    Each workspace receives free testing credits for building in the Workflow
    builder before going live (the pricing FAQ cites 50,000 free credits for
    trial and higher-tier accounts).
limits_controls:
  soft_limit: Email notification at a task threshold you set.
  hard_limit: Blocks Workflow and Playbook execution beyond the threshold you set.
  configured_at: Usage -> Limits in the workspace settings.
  protect_answers_tracking: >-
    Combined-task workspaces can reserve the projected tasks needed for Insights
    monitoring so tracking continues when other executions are paused.
legacy_plan_names:
  note: >-
    The pricing FAQ still references "Scale" and "Agency" plans, which no longer
    appear in the plan table. Recorded as an observed inconsistency on the
    provider's own page, not as current tiers.
