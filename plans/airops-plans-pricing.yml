generated: '2026-08-13'
method: searched
source: https://www.airops.com/pricing
docs:
- https://www.airops.com/pricing
- https://docs.airops.com/your-workspace/settings/billing
- https://docs.airops.com/your-workspace/settings/usage
plan_count: 3
currency: USD
billing_period: month
note: >-
  AirOps publishes three named tiers with feature and quota tables, but does NOT
  publish a monthly price for Pro or Enterprise — both route to "Start for Free" /
  "Talk to Sales". The only price literals on the page are "starting at $0/month"
  and the Solo overage rate of $0.025 per task. Quotas below are transcribed
  verbatim from the plan-comparison table. The billing unit is a "task"; the
  Insights side meters "Answers", which debit tasks (combined billing) or a
  separate Answer Credit balance (legacy plans) — see billing_model.
billing_model:
  unit: task
  models:
  - name: combined-task-billing
    description: >-
      Workflows, Playbooks and Insights Answers all draw from one monthly task
      balance; Answers appear as tasks in Usage.
  - name: legacy-answer-credits
    description: >-
      Workflows and Playbooks use tasks; Insights Answers are metered against a
      separate Answer Credit balance.
  answers_formula: platforms x regions x (1 + named personas) x 30 days
  provider_multipliers:
  - providers: [chat_gpt, gemini, perplexity, google_ai_mode, google_ai_overview]
    units_per_answer: 1
  - providers: [claude]
    units_per_answer: 4
  task_accounting:
  - step: Text input step
    tasks: 0
  - step: Code step
    tasks: max 1 per Workflow run
  - step: Vector DB call
    tasks: 1 per call
  - step: LLM step with your own API key
    tasks: 1 per call
  - step: LLM step with an AirOps hosted model
    tasks: proportional to usage
  - step: Other API step
    tasks: 1 per call
  - step: Output step
    tasks: 0
  note: >-
    Only steps that complete successfully are charged; errored steps are not
    charged, but embedded Workflows that incur tasks are.
